    <!-- First-paint splash.
         The native shell opens on an empty webview for well over a second before React
         mounts — measured at ~1.3s on the iPhone 17 simulator — and the iOS launch
         storyboard is already gone by then, so without this the app starts on a blank
         dark rectangle with nothing to say it is loading.
         The logo is inlined as a data URI rather than pulled from /splash-logo.png
         deliberately: a separate request would not have come back by first paint, which
         is the single moment this element exists to cover. It is ~9 KB, and it is the
         only thing in the document that has to be there before the bundle arrives. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05040c;
        transition: opacity 280ms ease-out;
      }
      #splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 62%;
        max-width: 340px;
        height: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
      }
    </style>
