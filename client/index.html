<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <title>ROBOTAT — Autonomous Agricultural Robots by NASL</title>
    <meta
      name="description"
      content="Autonomous robots that scout, spray, cultivate, and maintain — across orchards, row crops, protected agriculture, and solar sites. Book a free site assessment."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#06040d" />
    <link rel="canonical" href="https://robotat2-production.up.railway.app/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Home-screen web clip. Wider margins than favicon.png because iOS masks this to a
         rounded square, so it is cut from the app icon rather than the favicon. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ROBOTAT" />
    <meta property="og:title" content="ROBOTAT — Autonomous Agricultural Robots by NASL" />
    <meta
      property="og:description"
      content="Autonomous robots that scout, spray, cultivate, and maintain across orchards, row crops, protected agriculture, and solar sites."
    />
    <meta property="og:url" content="https://robotat2-production.up.railway.app/" />
    <meta property="og:image" content="https://robotat2-production.up.railway.app/og-image.jpg" />
    <meta property="og:locale" content="en" />
    <meta property="og:locale:alternate" content="ar" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ROBOTAT — Autonomous Agricultural Robots by NASL" />
    <meta
      name="twitter:description"
      content="Autonomous robots for orchards, row crops, protected agriculture, and solar sites."
    />
    <meta name="twitter:image" content="https://robotat2-production.up.railway.app/og-image.jpg" />

    <!-- Fonts are self-hosted (see client/src/index.css and client/public/fonts/).
         Nothing here may load a font from a third-party CDN: this client is bundled
         into the iOS app, and a launch-time stylesheet fetch fails offline. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/ibm-plex-sans-arabic-400-latin.woff2"
      crossorigin
    />

    <!-- Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ROBOTAT",
        "legalName": "ROBOTAT by NASL Technologies",
        "url": "https://robotat2-production.up.railway.app/",
        "logo": "https://robotat2-production.up.railway.app/favicon.png",
        "description": "Autonomous agricultural robots for orchards, row crops, protected agriculture, and solar sites.",
        "parentOrganization": { "@type": "Organization", "name": "NASL Technologies" },
        "areaServed": "SA"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
