name: Checks

# The single definition of "is this commit good?" — audit, typecheck, migrations,
# tests, production build.
#
# Called by BOTH ci.yml (on pushes, PRs and tags) and cd.yml (before publishing an
# image). CD used to trigger independently on push, which meant a commit that failed
# typecheck or tests was still built, tagged `latest`, pushed to GHCR and — once
# DEPLOY_ENABLED was set — shipped to the host. Making CD depend on this job closes
# that gap without duplicating the definition.

on:
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: robotat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Name contains "test" so the test-suite safety guard allows it.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robotat_test
      SESSION_SECRET: ci-secret

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

      # Last, and `!cancelled()` so it runs even when something above it failed.
      #
      # This used to sit directly after `npm ci`, where it was the first thing that could
      # fail — and a step that fails takes the rest of the job with it. So a single
      # advisory in a transitive dependency switched off typecheck, migrations, tests and
      # build, all at once, and the job's red said "vulnerability" while saying nothing
      # about the code.
      #
      # That is not hypothetical. `nanoid` tripped this on 2026-08-07 and every run for
      # the next four days died here. Behind it, a security test added in that same window
      # (the concurrent-burst case in test/account-recovery.test.ts) was failing and could
      # not be seen, because the suite never ran. The cheap problem hid the expensive one.
      #
      # Reordering alone would only invert that — a failing test would then hide an
      # advisory. `!cancelled()` is what makes it neither: both checks report on every run,
      # and neither can mask the other. The audit still fails the job, so cd.yml still
      # refuses to publish an image with a high or critical advisory in it. Only the
      # ordering changed, not the gate.
      - name: Security audit (fail on high or critical)
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
