name: CI

# Runs the shared checks on every push to main, every pull request, and every
# version tag. Tags are included so that a tag-triggered release in cd.yml has a
# corresponding CI run of the same commit.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
